# Builds an Android APK on GitHub's servers — no Android Studio, no Terminal.
#
#   GitHub › Actions › "Build Android APK" › Run workflow › (check the boxes) › Run workflow
#   Wait ~5–8 min › open the finished run › Artifacts › download "pos-apk" (zip with app-debug.apk inside)
#
# How it works: a Capacitor shell app that opens your Vercel URL full screen.
# The screens come from Vercel, so code changes on GitHub reach the app automatically —
# rebuild the APK only to change the app name, icon or URL.
#
# Note: this is a "debug" APK (fine for installing on your own tablets). Every build is signed with a
# new key, so to install a NEWER build: uninstall the old app first, then install the new one.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name under the icon'
        required: true
        default: 'Faiha Kitchen POS'
      app_id:
        description: 'Package ID (lowercase, dots, unique)'
        required: true
        default: 'com.faihakitchen.pos'
      url:
        description: 'Vercel URL the app opens'
        required: true
        default: 'https://pos-system-7hb5.vercel.app'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build the web app (offline fallback inside the APK)
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Add Capacitor (Android shell)
        run: npm install --no-save --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0

      - name: Write capacitor.config.json
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.app_id }}
          APP_URL: ${{ inputs.url }}
        run: |
          node -e '
            const cfg = {
              appId: process.env.APP_ID,
              appName: process.env.APP_NAME,
              webDir: "dist",
              server: { url: process.env.APP_URL.replace(/\/$/, ""), cleartext: false },
              android: { allowMixedContent: false }
            };
            require("fs").writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
            console.log(cfg);
          '

      - name: Create Android project
        run: npx cap add android

      - name: App icon (from public/icon-512.png)
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            convert public/icon-512.png -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
            rm -f $RES/mipmap-$d/ic_launcher_foreground.png
          done

      - name: Keep the screen on and hide the status bar (POS tablet)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java)
          cat > "$F" <<EOF
          package ${{ inputs.app_id }};

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
            }
          }
          EOF
          cat "$F"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
